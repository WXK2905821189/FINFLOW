spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:2h}
  product:
    active-payment-enabled: ${PAYMENT_ENABLED:false}

bank:
  citic:
    mock-mode: ${CITIC_MOCK_MODE:true}

logging:
  level:
    com.finance.system: INFO
