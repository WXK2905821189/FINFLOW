spring:
  application:
    name: finance-system-backend
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor-migration/{vendor}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: dev-only-secret-change-me-before-production-2026
    expiration: 2h
  product:
    active-payment-enabled: ${PAYMENT_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bank:
  citic:
    mock-mode: true
    base-url: ${CITIC_BASE_URL:https://api.example.invalid/citic}
    app-id: ${CITIC_APP_ID:}

statement:
  collection:
    mode: ${STATEMENT_COLLECTION_MODE:file}

kingdee:
  mock-mode: ${KINGDEE_MOCK_MODE:true}

bankdata:
  adapter:
    mode: mock
  sync:
    schedule-enabled: false
    fixed-delay-ms: 600000
  retention:
    cleanup-enabled: false
    cleanup-fixed-delay-ms: 3600000
    batch-limit: 100
