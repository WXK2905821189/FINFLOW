spring:
  application:
    name: finance-system-backend
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor-migration/{vendor}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: dev-only-secret-change-me-before-production-2026
    expiration: 2h
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bank:
  citic:
    mock-mode: true
    base-url: ${CITIC_BASE_URL:https://api.example.invalid/citic}
    app-id: ${CITIC_APP_ID:}

statement:
  collection:
    mode: ${STATEMENT_COLLECTION_MODE:file}

kingdee:
  mock-mode: ${KINGDEE_MOCK_MODE:true}

bankdata:
  adapter:
    mode: ${BANKDATA_ADAPTER_MODE:mock}
    call:
      real-adapters-enabled: ${BANKDATA_REAL_ADAPTERS_ENABLED:false}
      max-attempts: ${BANKDATA_ADAPTER_MAX_ATTEMPTS:3}
      timeout-millis: ${BANKDATA_ADAPTER_TIMEOUT_MILLIS:5000}
      base-backoff-millis: ${BANKDATA_ADAPTER_BASE_BACKOFF_MILLIS:200}
      max-requests-per-minute: ${BANKDATA_ADAPTER_MAX_REQUESTS_PER_MINUTE:60}
    citic:
      real-enabled: ${BANKDATA_CITIC_REAL_ENABLED:false}
      start-record-base: 1
      page-size: 20
      control-flag: 2
      query-rate-limit-per-hour: 400
      sdk:
        url: ${CITIC_SDK_URL:}
        org-code: ${CITIC_ORG_CODE:}
        user-name: ${CITIC_USER_NAME:}
        cash-flag: 0
        cert-path: ${CITIC_CERT_PATH:}
        download-code: ${CITIC_DOWNLOAD_CODE:}
        host-ip: ${CITIC_HOST_IP:}
        open-comm-custom: true
        log-path: ${CITIC_SDK_LOG_PATH:}
        token: ${CITIC_TOKEN:}
  sync:
    schedule-enabled: false
    fixed-delay-ms: 600000
  retention:
    cleanup-enabled: false
    cleanup-fixed-delay-ms: 3600000
    batch-limit: 100
