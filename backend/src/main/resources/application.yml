spring:
  application:
    name: finance-system-backend
  profiles:
    default: dev
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor-migration/{vendor}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: dev-only-secret-change-me-before-production-2026
    expiration: 2h
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bank:
  citic:
    mock-mode: true
    base-url: ${CITIC_BASE_URL:https://api.example.invalid/citic}
    app-id: ${CITIC_APP_ID:}

statement:
  collection:
    mode: ${STATEMENT_COLLECTION_MODE:file}

kingdee:
  mock-mode: ${KINGDEE_MOCK_MODE:true}
  # Real gateway (official K3Cloud WebAPI SDK v8.2.0, kingdee-sdk Maven profile).
  # Activation requires ALL of: SDK jar in local ~/.m2 (kingdee-sdk profile active),
  # KINGDEE_REAL_ENABLED=true, and the credential block below filled via env vars.
  # Credentials are never committed (CI release-contract enforces this).
  real-enabled: ${KINGDEE_REAL_ENABLED:false}
  server-url: ${KINGDEE_SERVER_URL:}
  acct-id: ${KINGDEE_ACCT_ID:}
  app-id: ${KINGDEE_APP_ID:}
  app-sec: ${KINGDEE_APP_SEC:}
  user-name: ${KINGDEE_USER_NAME:}
  lcid: ${KINGDEE_LCID:2052}
  org-number: ${KINGDEE_ORG_NUMBER:100}
  currency-number: ${KINGDEE_CURRENCY_NUMBER:PRE001}
  settle-type-number: ${KINGDEE_SETTLE_TYPE_NUMBER:JSFS04_SYS}
  # Counterparty auto-provisioning (calibrated 2026-09-07: minimal BD_Supplier/BD_Customer
  # save works; duplicate number rejection is the idempotency signal).
  auto-create-counterparty: ${KINGDEE_AUTO_CREATE_COUNTERPARTY:true}
  counterparty-number-prefix: ${KINGDEE_COUNTERPARTY_NUMBER_PREFIX:FINFLW}
  customer-type-number: ${KINGDEE_CUSTOMER_TYPE_NUMBER:KHLB001_SYS}
  # Optional submit+audit after save (default off; business decision at 9/11 joint test).
  auto-audit: ${KINGDEE_AUTO_AUDIT:false}
  pay-bill-form-id: ${KINGDEE_PAY_BILL_FORM_ID:AP_PAYBILL}
  receive-bill-form-id: ${KINGDEE_RECEIVE_BILL_FORM_ID:AR_RECEIVEBILL}

bankdata:
  adapter:
    # bankdata.adapter.mode was removed (mock-clean 2026-09-04): production ships no simulated
    # adapters, routing is fail-closed. The old BANKDATA_ADAPTER_MODE env var is a no-op.
    call:
      real-adapters-enabled: ${BANKDATA_REAL_ADAPTERS_ENABLED:false}
      max-attempts: ${BANKDATA_ADAPTER_MAX_ATTEMPTS:3}
      timeout-millis: ${BANKDATA_ADAPTER_TIMEOUT_MILLIS:5000}
      base-backoff-millis: ${BANKDATA_ADAPTER_BASE_BACKOFF_MILLIS:200}
      max-requests-per-minute: ${BANKDATA_ADAPTER_MAX_REQUESTS_PER_MINUTE:60}
    citic:
      real-enabled: ${BANKDATA_CITIC_REAL_ENABLED:false}
      start-record-base: 1
      page-size: 20
      control-flag: 2
      query-rate-limit-per-hour: 400
      sdk:
        url: ${CITIC_SDK_URL:}
        org-code: ${CITIC_ORG_CODE:}
        user-name: ${CITIC_USER_NAME:}
        # 0=single customer, 1=group/cluster customer (bank-issued; TSEA joint-testing account is 1)
        cash-flag: ${CITIC_CASH_FLAG:0}
        cert-path: ${CITIC_CERT_PATH:}
        download-code: ${CITIC_DOWNLOAD_CODE:}
        host-ip: ${CITIC_HOST_IP:}
        # Optional fixed MAC for the SDK identity check; empty = probe the runtime NIC.
        mac-address: ${CITIC_MAC_ADDRESS:}
        open-comm-custom: true
        log-path: ${CITIC_SDK_LOG_PATH:}
        token: ${CITIC_TOKEN:}
    cmb:
      # CMB CloudDC (免前置). Secrets come from environment variables only — never commit keys.
      # Test endpoint http://cdctest.cmburl.cn:80/cdcserver/api/v2 ; prod https://cdc.cmbchina.com/cdcserver/api/v2
      real-enabled: ${BANKDATA_CMB_REAL_ENABLED:false}
      url: ${CMB_URL:}
      uid: ${CMB_UID:}
      private-key: ${CMB_PRIVATE_KEY:}
      public-key: ${CMB_PUBLIC_KEY:}
      sym-key: ${CMB_SYM_KEY:}
      branch-code: ${CMB_BRANCH_CODE:}
      connect-timeout-ms: 15000
      read-timeout-ms: 60000
  sync:
    # Daily T-1 auto-pull (per ACTIVE bank account, REAL-adapter banks only). Off by default;
    # production turns it on via BANKDATA_SYNC_SCHEDULE_ENABLED=true.
    schedule-enabled: ${BANKDATA_SYNC_SCHEDULE_ENABLED:false}
    fixed-delay-ms: ${BANKDATA_SYNC_FIXED_DELAY_MS:600000}
  retention:
    cleanup-enabled: false
    cleanup-fixed-delay-ms: 3600000
    batch-limit: 100
