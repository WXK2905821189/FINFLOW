# CITIC DLink SDK fallback configuration (classpath safety net)
#
# The SDK reads this file during class loading. SdkCiticDlinkSdk injects the real
# per-environment settings through OpenCommunication.setCfgPropertiesByte(byte[])
# BEFORE the singleton is created, so values here are only a harmless static default
# (TSEA test endpoint) that keeps SDK class loading side-effect free.
# Production values come from environment variables: CITIC_SDK_URL / CITIC_HOST_IP /
# CITIC_SDK_LOG_PATH / CITIC_TOKEN / bankdata.adapter.citic.sdk.* in application.yml.
CITICBANK.URL=http://202.108.57.60:8080/DLink/DLServlet/Open
CITICBANK.proxy.http.hostname=
CITICBANK.proxy.http.port=
CITICBANK.proxy.username=
CITICBANK.proxy.password=
CITICBANK.host.ip=
CITICBANK.OpenCommunicationCustom=false
CITICBANK.log.path=logs
CITICBANK.log.limit=100
CITICBANK.log.history=30
CITICBANK.sftp.actions=
