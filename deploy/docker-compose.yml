services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finflow-app
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2h}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
      CITIC_MOCK_MODE: ${CITIC_MOCK_MODE:-true}
      # 金蝶 K3Cloud 真实网关（kingdee-sdk profile）：凭据仅经 .env 注入，严禁入库（CI release-contract 强制）
      KINGDEE_MOCK_MODE: ${KINGDEE_MOCK_MODE:-true}
      KINGDEE_REAL_ENABLED: ${KINGDEE_REAL_ENABLED:-false}
      KINGDEE_SERVER_URL: ${KINGDEE_SERVER_URL:-}
      KINGDEE_ACCT_ID: ${KINGDEE_ACCT_ID:-}
      KINGDEE_APP_ID: ${KINGDEE_APP_ID:-}
      KINGDEE_APP_SEC: ${KINGDEE_APP_SEC:-}
      KINGDEE_USER_NAME: ${KINGDEE_USER_NAME:-}
      KINGDEE_LCID: ${KINGDEE_LCID:-2052}
      KINGDEE_ORG_NUMBER: ${KINGDEE_ORG_NUMBER:-100}
      KINGDEE_DEFAULT_BANK_ACCOUNT_NUMBER: ${KINGDEE_DEFAULT_BANK_ACCOUNT_NUMBER:-}
      # 待确认兜底科目（2026-09-21）：AI 科目不可用/低置信度时替换；默认 2241.99 其他应付款-其他
      # （实测：2241 是父科目不可记账；2241.99 为明细科目且无必录维度）。
      # 这两个键必须在此透传，否则在 .env 里改了也不生效（compose 白名单是唯一入口）。
      KINGDEE_FALLBACK_ACCOUNT: ${KINGDEE_FALLBACK_ACCOUNT:-2241.99}
      KINGDEE_LOW_CONFIDENCE_THRESHOLD: ${KINGDEE_LOW_CONFIDENCE_THRESHOLD:-0.6}
      # BANKDATA_ADAPTER_MODE removed (de-mock cleanup 2026-09-04; Spring no longer consumes it)
      BANKDATA_REAL_ADAPTERS_ENABLED: ${BANKDATA_REAL_ADAPTERS_ENABLED:-false}
      BANKDATA_CMB_REAL_ENABLED: ${BANKDATA_CMB_REAL_ENABLED:-false}
      CMB_URL: ${CMB_URL:-}
      CMB_UID: ${CMB_UID:-}
      CMB_PRIVATE_KEY: ${CMB_PRIVATE_KEY:-}
      CMB_PUBLIC_KEY: ${CMB_PUBLIC_KEY:-}
      CMB_SYM_KEY: ${CMB_SYM_KEY:-}
      CMB_BRANCH_CODE: ${CMB_BRANCH_CODE:-}
      # 每日 T-1 自动拉数（bankdata.sync.schedule-enabled），账户驱动、仅 REAL 适配器银行
      BANKDATA_SYNC_SCHEDULE_ENABLED: ${BANKDATA_SYNC_SCHEDULE_ENABLED:-false}
      BANKDATA_SYNC_FIXED_DELAY_MS: ${BANKDATA_SYNC_FIXED_DELAY_MS:-600000}
      # CITIC 银企直联 SDK 直连（TSEA 联调 2026-09-10）；证书下载码用后作废，token 定稿后不可改
      BANKDATA_CITIC_REAL_ENABLED: ${BANKDATA_CITIC_REAL_ENABLED:-false}
      CITIC_SDK_URL: ${CITIC_SDK_URL:-}
      CITIC_ORG_CODE: ${CITIC_ORG_CODE:-}
      CITIC_USER_NAME: ${CITIC_USER_NAME:-}
      CITIC_CASH_FLAG: ${CITIC_CASH_FLAG:-0}
      CITIC_CERT_PATH: ${CITIC_CERT_PATH:-}
      CITIC_DOWNLOAD_CODE: ${CITIC_DOWNLOAD_CODE:-}
      CITIC_TOKEN: ${CITIC_TOKEN:-}
      CITIC_MAC_ADDRESS: ${CITIC_MAC_ADDRESS:-}
      CITIC_HOST_IP: ${CITIC_HOST_IP:-}
      CITIC_SDK_LOG_PATH: ${CITIC_SDK_LOG_PATH:-}
      # AI 能力（V27/V28）：默认全关；启用走 AI 设置页（DB 在线配置）或以下 env（DB 优先）
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_CAPABILITY_SELF_TEST: ${AI_CAPABILITY_SELF_TEST:-false}
      AI_CAPABILITY_ACCOUNTING_SUGGESTION: ${AI_CAPABILITY_ACCOUNTING_SUGGESTION:-false}
    # 不向宿主机暴露 8080，仅由 nginx 内网转发
    expose:
      - "8080"
    volumes:
      - ./logs:/app/logs
      # CITIC 云证书持久化：下载码一次性，容器重建不能丢证书
      - ./citic-cert:/app/citic-cert
    # 健康检查：探测 8080 端口。temurin 镜像无 curl/wget，用 bash /dev/tcp
    # nginx 的 depends_on: service_healthy 依赖此检查，缺了它 web 永远不会启动
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  nginx:
    image: nginx:1.27-alpine
    container_name: finflow-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # location 片段挂到 conf.d 之外（.inc），避免被 conf.d/*.conf 通配在 http 顶层重复加载
      # （conf.d 下每个 .conf 都会被 nginx 当独立 http 配置解析，location 在 http 顶层非法会导致 [emerg]）
      - ./nginx-app-locations.conf:/etc/nginx/app-locations.inc:ro
      # HTTPS：启用时把下面这行的注释去掉，并把证书放到 ./certs/（手册 §9）
      # - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # 方案 A-2（Let's Encrypt certbot webroot 续期）才需要挂载：
      # - ./certbot-www:/var/www/certbot:ro
      - ./web-dist:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
