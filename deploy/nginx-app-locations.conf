# 共享的 location 配置：HTTP(nginx.conf) 与 HTTPS(nginx-https.conf) 两个 server 块都 include 本文件
# 修改路由/代理规则只需改这一处

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# 带哈希的静态资源可长缓存
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# index.html 必须禁缓存。
# 原因：index.html 是唯一「文件名不带哈希」的入口，它引用的是带哈希的 chunk 名。
# 原先这里没有任何 Cache-Control，浏览器只能启发式缓存（heuristic caching，约取
# Last-Modified 距今时长的 10%），于是用户会长期拿到旧 index.html —— 而它引用的旧 chunk
# 一旦随版本清理就 404，表现为「旧界面还打得开」或「白屏」，看起来就像服务器没更新。
# 2026-09-18 实测：assets/ 曾累积 121 个历史 chunk（占六成体积），叠加本条缺失，
# 旧界面可长期正常打开 —— 这就是「服务器好像没更新」的真实根因。
# SPA 回退（try_files ... /index.html）会内部重定向到本 location，从而命中同一套头。
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri =404;
}

# SPA 路由回退
location / {
    try_files $uri $uri/ /index.html;
}

# 后端 API 反向代理（不对外暴露 8080）
location /api/ {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 20m;
}

# 禁止直接访问 Swagger（生产如需临时开放可注释掉）
location ~ ^/(v3/api-docs|swagger-ui) {
    return 404;
}
