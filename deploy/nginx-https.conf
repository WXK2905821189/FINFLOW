# HTTPS 版配置：证书就位后替换 nginx.conf 使用（手册 §9）
# 前置条件：
#   1. ./certs/fullchain.pem 与 ./certs/privkey.pem 已存在（compose 已挂载到 /etc/nginx/certs）
#   2. 安全组已放行 443
#   3. docker compose restart nginx
# 注意：证书文件缺失时 nginx 会启动失败，届时换回 nginx.conf 即可回退 HTTP

# HTTP 全部 301 跳转 HTTPS
server {
    listen 80;
    server_name _;

    # Let's Encrypt certbot webroot 续期走这个路径（方案 A-2 才需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/app-locations.inc;
}
