name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify migration and integration boundaries
        shell: bash
        run: |
          set -euo pipefail
          migration_dir=backend/src/main/resources/db/migration
          test -f "$migration_dir/V1__init_rbac_and_bank_accounts.sql"
          test -f "$migration_dir/V2__statement_import_and_voucher_push.sql"
          compgen -G "$migration_dir/V3__*.sql" > /dev/null
          test -f "$migration_dir/V4__bank_data_access_foundation.sql"
          test -f "$migration_dir/V5__bank_data_balance_and_adapter_port.sql"
           test -f "$migration_dir/V6__tenant_statement_payment_and_session_safety.sql"
           test -f "$migration_dir/V8__payment_request_audit_and_unknown_resolution.sql"
           test -f "$migration_dir/V9__bankdata_phase2_windows_retention.sql"
           test -f "$migration_dir/V10__feishu_mock_collaboration.sql"
           test -f "$migration_dir/V11__rules_closing_and_audit_center.sql"
           test -f "$migration_dir/V12__bankdata_unified_aggregation_trace.sql"
           test -f "$migration_dir/V13__permission_code_convergence.sql"
           test -f "$migration_dir/V14__retire_dead_transfer_permissions.sql"
           test -f backend/src/main/resources/db/vendor-migration/h2/V7__drop_legacy_statement_number_uniqueness.sql
           test -f backend/src/main/resources/db/vendor-migration/mysql/V7__drop_legacy_statement_number_uniqueness.sql
           expected_versions=(V1 V2 V3 V4 V5 V6 V8 V9 V10 V11 V12 V13 V14 V15 V16 V17 V18 V19 V20 V21 V22 V23 V24 V25 V26 V27 V28 V29 V30 V31 V32 V33 V34 V35 V37 V38 V39 V40 V41 V42 V43 V44 V45)
          actual_versions=()
          while IFS= read -r migration; do
            version="${migration##*/}"
            version="${version%%__*}"
            actual_versions+=("$version")
          done < <(find "$migration_dir" -maxdepth 1 -type f -name 'V*.sql' -printf '%f\n' | sort -V)
          test "${actual_versions[*]}" = "${expected_versions[*]}"
          grep -q 'ADD COLUMN response_payload' "$migration_dir/V23__bank_raw_message_true_evidence.sql"
          grep -q 'ADD COLUMN request_evidence' "$migration_dir/V23__bank_raw_message_true_evidence.sql"
          grep -q "bankdata:cross-company:view" "$migration_dir/V24__bankdata_cross_company_permission.sql"
          grep -q 'INSERT INTO sys_role_permission' "$migration_dir/V24__bankdata_cross_company_permission.sql"
          grep -q 'system:dict:manage' "$migration_dir/V26__system_dict_center.sql"
          grep -q 'CREATE TABLE sys_dict_type' "$migration_dir/V26__system_dict_center.sql"
          test -f "$migration_dir/V27__ai_gateway_foundation.sql"
          grep -q 'CREATE TABLE ai_call_log' "$migration_dir/V27__ai_gateway_foundation.sql"
          grep -q 'ai:config' "$migration_dir/V27__ai_gateway_foundation.sql"
          test -f "$migration_dir/V28__ai_provider_config.sql"
          grep -q 'CREATE TABLE ai_provider_config' "$migration_dir/V28__ai_provider_config.sql"
          test -f "$migration_dir/V29__feishu_app_config.sql"
          grep -q 'CREATE TABLE feishu_app_config' "$migration_dir/V29__feishu_app_config.sql"
          test -f "$migration_dir/V30__dict_company_entity_wording.sql"
          grep -q 'UPDATE sys_dict_type' "$migration_dir/V30__dict_company_entity_wording.sql"
          grep -q "company_entity" "$migration_dir/V30__dict_company_entity_wording.sql"
          test -f "$migration_dir/V31__bank_account_accounting_mode.sql"
          grep -q 'ADD COLUMN accounting_mode' "$migration_dir/V31__bank_account_accounting_mode.sql"
          grep -q "KINGDEE_AUTO" "$migration_dir/V31__bank_account_accounting_mode.sql"
          test -f "$migration_dir/V32__account_soft_delete_and_ai_config_scope.sql"
          grep -q 'ADD COLUMN deleted TINYINT NOT NULL DEFAULT 0' "$migration_dir/V32__account_soft_delete_and_ai_config_scope.sql"
          grep -q 'permission_id = 43 AND role_id = 2' "$migration_dir/V32__account_soft_delete_and_ai_config_scope.sql"
          test -f "$migration_dir/V33__permission_baseline_replan_and_voucher_draft.sql"
          grep -q 'ADD COLUMN ai_suggestion_json' "$migration_dir/V33__permission_baseline_replan_and_voucher_draft.sql"
          grep -q '(3, 13),' "$migration_dir/V33__permission_baseline_replan_and_voucher_draft.sql"
          test -f "$migration_dir/V34__kingdee_voucher_rule_seed.sql"
          grep -q 'CREATE TABLE kingdee_voucher_rule' "$migration_dir/V34__kingdee_voucher_rule_seed.sql"
          grep -q 'uk_kingdee_voucher_rule_no' "$migration_dir/V34__kingdee_voucher_rule_seed.sql"
          test -f "$migration_dir/V35__account_preference.sql"
          grep -q 'CREATE TABLE account_preference' "$migration_dir/V35__account_preference.sql"
          grep -q 'uk_account_preference_user_scope' "$migration_dir/V35__account_preference.sql"
          test -f "$migration_dir/V37__rule_group_and_rule_crud.sql"
          grep -q 'CREATE TABLE kingdee_rule_group' "$migration_dir/V37__rule_group_and_rule_crud.sql"
          grep -q 'uk_kingdee_rule_group_name' "$migration_dir/V37__rule_group_and_rule_crud.sql"
          test -f "$migration_dir/V38__ai_prompt_override.sql"
          grep -q 'CREATE TABLE ai_prompt_override' "$migration_dir/V38__ai_prompt_override.sql"
          grep -q 'uk_ai_prompt_override_capability' "$migration_dir/V38__ai_prompt_override.sql"
          test -f "$migration_dir/V39__statement_withdraw.sql"
          grep -q 'ADD COLUMN withdrawn_at' "$migration_dir/V39__statement_withdraw.sql"
          grep -q 'ADD COLUMN withdrawn_by' "$migration_dir/V39__statement_withdraw.sql"
          test -f "$migration_dir/V40__ai_voucher_job.sql"
          grep -q 'CREATE TABLE ai_voucher_job' "$migration_dir/V40__ai_voucher_job.sql"
          grep -q 'idx_ai_voucher_job_company_created' "$migration_dir/V40__ai_voucher_job.sql"
          test -f "$migration_dir/V41__bank_account_kingdee_mapping.sql"
          grep -q 'ALTER TABLE bank_account ADD COLUMN kingdee_account_number' "$migration_dir/V41__bank_account_kingdee_mapping.sql"
          test -f "$migration_dir/V42__kingdee_dimension_slot_and_mapping.sql"
          grep -q 'CREATE TABLE kingdee_dimension_slot' "$migration_dir/V42__kingdee_dimension_slot_and_mapping.sql"
          grep -q 'CREATE TABLE kingdee_dimension_mapping' "$migration_dir/V42__kingdee_dimension_slot_and_mapping.sql"
          grep -q 'uk_kd_dim_map_key UNIQUE (dimension_type, source_key, org_code)' "$migration_dir/V42__kingdee_dimension_slot_and_mapping.sql"
          test -f "$migration_dir/V43__bank_push_job_drop_ai_voucher_job.sql"
          grep -q 'CREATE TABLE bank_push_job' "$migration_dir/V43__bank_push_job_drop_ai_voucher_job.sql"
          grep -q 'problem_count INT NOT NULL DEFAULT 0' "$migration_dir/V43__bank_push_job_drop_ai_voucher_job.sql"
          grep -q 'DROP TABLE IF EXISTS ai_voucher_job' "$migration_dir/V43__bank_push_job_drop_ai_voucher_job.sql"
          test -f "$migration_dir/V45__sys_user_permission.sql"
          grep -q 'CREATE TABLE sys_user_permission' "$migration_dir/V45__sys_user_permission.sql"
          grep -q 'UNIQUE KEY uk_user_perm (user_id, permission_code)' "$migration_dir/V45__sys_user_permission.sql"
          grep -q 'CREATE TABLE bank_data_raw_message' "$migration_dir/V4__bank_data_access_foundation.sql"
          grep -q 'retention_until TIMESTAMP NOT NULL' "$migration_dir/V4__bank_data_access_foundation.sql"
          # --- Java-source assertions: policy (2026-09-21, review A6) ------------------
          # Everything below is a *structural* guard: it asserts that a named construct
          # exists in a named file. It is deliberately not a substitute for a unit test,
          # so a legitimate rename/repackage can turn it red while the behaviour is still
          # intact — when that happens, fix the assertion first; do not assume a regression.
          # Patterns stay at token/behaviour level (never an exact statement) so that
          # renaming a local variable or reformatting cannot fail the build.
          # ---------------------------------------------------------------------------
          # raw evidence must be kept for 30 days: any receiver/format is fine, but
          # changing the retention window itself must fail.
          grep -qE 'setRetentionUntil\([^()]*plusDays\([[:space:]]*30[[:space:]]*\)' backend/src/main/java/com/finance/system/bankdata/BankDataSyncEvidenceService.java
          # raw evidence is written in its own transaction so a later failure cannot lose it
          grep -q 'Propagation.REQUIRES_NEW' backend/src/main/java/com/finance/system/bankdata/BankDataSyncEvidenceService.java
          # the daily sweep stays on a Spring scheduler
          grep -q '@Scheduled' backend/src/main/java/com/finance/system/bankdata/BankDataSyncScheduler.java
          # POST /bank-sync-jobs is the manual top-up contract — the path itself is the contract
          grep -q '@PostMapping("/bank-sync-jobs")' backend/src/main/java/com/finance/system/bankdata/BankPipelineController.java
          # mock adapters are test-only fixtures since the de-mock cleanup: they must never
          # ship inside src/main (a production mock fallback would defeat fail-closed routing)
          ! grep -q 'class MockBankDataAdapter' backend/src/main/java/com/finance/system/bankdata/adapter/MockBankDataAdapter.java 2>/dev/null
          test -f backend/src/test/java/com/finance/system/bankdata/adapter/MockBankDataAdapter.java
          grep -q 'class MockBankDataAdapter' backend/src/test/java/com/finance/system/bankdata/adapter/MockBankDataAdapter.java
          # manual top-up accepts a caller-supplied requestId (the idempotency key). This is the
          # only requestId assertion needed — the bare-token duplicate below it was dropped.
          grep -q 'String requestId' backend/src/main/java/com/finance/system/bankdata/BankPipelineController.java
          grep -q 'url: \${DB_URL}' backend/src/main/resources/application-prod.yml
          grep -q 'username: \${DB_USERNAME}' backend/src/main/resources/application-prod.yml
          grep -q 'password: \${DB_PASSWORD}' backend/src/main/resources/application-prod.yml
          ! grep -q 'DB_USERNAME:finance' backend/src/main/resources/application-prod.yml
          ! grep -q 'useSSL=false' backend/src/main/resources/application-prod.yml
          # UNKNOWN must keep an explicit branch in the status -> summary mapping. NOTE:
          # BankDataStatus.UNKNOWN is also used elsewhere in this file as a value, so the
          # branch label is the only meaningful anchor (a pattern matching the bare enum
          # constant would stay green even after the branch is deleted). Pin the label only,
          # so switching between `case X ->` and `case X:` syntax stays green.
          grep -q 'case UNKNOWN' backend/src/main/java/com/finance/system/bankdata/aggregation/BankDataAggregationService.java
          grep -q 'request_id' backend/src/main/resources/db/migration/V8__payment_request_audit_and_unknown_resolution.sql
          grep -q 'CONSTRAINT uk_bank_statement_business UNIQUE (company_id, bank_account_id, statement_no, transaction_time, amount)' "$migration_dir/V4__bank_data_access_foundation.sql"
          grep -q 'CREATE UNIQUE INDEX uk_bank_sync_task_request ON bank_data_sync_task(company_id, request_id)' "$migration_dir/V4__bank_data_access_foundation.sql"
          grep -q 'CONSTRAINT uk_payment_company_idempotency UNIQUE (company_id, idempotency_key)' "$migration_dir/V6__tenant_statement_payment_and_session_safety.sql"
           grep -q 'ALTER TABLE payment_transfer ADD COLUMN request_id' backend/src/main/resources/db/migration/V8__payment_request_audit_and_unknown_resolution.sql
           grep -q 'ALTER TABLE bank_data_sync_task ADD COLUMN sync_key' "$migration_dir/V9__bankdata_phase2_windows_retention.sql"
           grep -q 'CREATE INDEX idx_bank_raw_retention_purge' "$migration_dir/V9__bankdata_phase2_windows_retention.sql"
           grep -q 'CREATE TABLE validation_rule' "$migration_dir/V11__rules_closing_and_audit_center.sql"
           grep -q 'CREATE TABLE closing_period' "$migration_dir/V11__rules_closing_and_audit_center.sql"
           grep -q 'CREATE TABLE system_audit_event' "$migration_dir/V11__rules_closing_and_audit_center.sql"
           grep -q 'ADD COLUMN mapping_version' "$migration_dir/V12__bankdata_unified_aggregation_trace.sql"
           grep -q 'code IN ('"'"'bankdata:sync'"'"', '"'"'bank-sync:trigger'"'"', '"'"'bankdata:payment:view'"'"')' "$migration_dir/V13__permission_code_convergence.sql"
          grep -q 'DROP CONSTRAINT IF EXISTS' backend/src/main/resources/db/vendor-migration/h2/V7__drop_legacy_statement_number_uniqueness.sql
          grep -q 'PREPARE drop_legacy_statement_index' backend/src/main/resources/db/vendor-migration/mysql/V7__drop_legacy_statement_number_uniqueness.sql
          grep -q 'classpath:db/vendor-migration/{vendor}' backend/src/main/resources/application.yml
          # bankdata must not call a real bank over HTTP yet. The only http(s) literals allowed
          # anywhere in bankdata sources are XML parser hardening URIs (declared below as an
          # explicit allow-list, P2-1). A real gateway URL — even inside a javadoc comment — fails
          # the build on purpose: source comments travel through git history/mirrors and would leak
          # the gateway address. Record approved gateway addresses in docs/ instead.
          url_allowlist='apache\.org/xml/features|xml\.org/sax/features'
          if git grep -n -I -E '(HttpClient|RestTemplate|WebClient|java\.net\.http|https?://)' -- backend/src/main/java/com/finance/system/bankdata \
             | grep -vE "$url_allowlist"; then
            echo "v0.2 must not call a real bank SDK or API before a separately approved adapter release."
            echo "Bank gateway URLs are not allowed in bankdata sources (code OR comments): register the"
            echo "approved address in docs/ (e.g. docs/bank-connect-schedule-2026-09-03.md)."
            exit 1
          fi
          if git grep -n -I -E '(BANK|KINGDEE)_(API_)?(KEY|SECRET|TOKEN)=[^${[:space:]]+' -- . ':!docs/deployment-guide.md'; then
            echo "Production bank or Kingdee credentials must not be committed."
            exit 1
          fi
          test -f docs/v0.2/bank-data-runbook.md
          grep -q 'Java 17 与 Java 8 SDK 兼容性验证' docs/v0.2/bank-data-runbook.md
          grep -q '网络白名单、IP 与 MAC 变更' docs/v0.2/bank-data-runbook.md
          grep -q '证书目录、日志目录与敏感配置注入' docs/v0.2/bank-data-runbook.md
          # authoritative delivery/ops docs that replaced the retired v0.2 validation reports (removed 7b7e06b)
          test -f docs/citic-bank-interface-dev-guide.md
          test -f docs/deployment-aliyun-2026-09-02-noconsole.md
          test -f docs/bank-connect-schedule-2026-09-03.md
          test -f docs/maintenance-sop.md
          test -f docs/pending-fixes.md
          # REAL CITIC stays off by default until bank whitelisting; the dev-guide must record that contract
          grep -q 'real-enabled' docs/citic-bank-interface-dev-guide.md
          if find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.pem' -o -iname '*.key' -o -iname '*citic*.jar' \) -not -path './frontend/node_modules/*' -print -quit | grep -q .; then
            echo "Bank SDK binaries, certificates, keystores, or private keys must not be committed."
            exit 1
          fi

  h2-migration:
    name: H2 migration (empty and repeat startup)
    needs: release-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package backend
        run: mvn --batch-mode --no-transfer-progress -P '!citic-sdk' clean package -DskipTests

      - name: Migrate H2 and verify repeat startup
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$jar_file"
          db_url="jdbc:h2:file:${RUNNER_TEMP}/finflow-h2;MODE=MySQL"
          first_log="${RUNNER_TEMP}/finflow-h2-first.log"
          repeat_log="${RUNNER_TEMP}/finflow-h2-repeat.log"

          wait_for_health() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:18080/v3/api-docs > /dev/null; then
                return 0
              fi
              sleep 2
            done
            cat "$1"
            return 1
          }

          java -jar "$jar_file" \
            --server.port=18080 \
            --spring.datasource.url="$db_url" \
            --spring.h2.console.enabled=false \
            > "$first_log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          wait_for_health "$first_log"
          grep -q 'Successfully applied 44 migrations' "$first_log"
          kill "$app_pid"
          wait "$app_pid" || true
          app_pid=""

          java -jar "$jar_file" \
            --server.port=18080 \
            --spring.datasource.url="$db_url" \
            --spring.h2.console.enabled=false \
            > "$repeat_log" 2>&1 &
          app_pid=$!
          wait_for_health "$repeat_log"
          grep -q 'Successfully validated 44 migrations' "$repeat_log"
          ! grep -q 'Migrating schema' "$repeat_log"
          kill "$app_pid"
          wait "$app_pid" || true
          app_pid=""

  mysql-migration:
    name: MySQL migration (CI service container)
    needs: release-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Start MySQL container (RDS-like flags)
        # GitHub Actions job services do not support a custom `command`, so mysqld is
        # started with a plain docker run. mysql:8.0 matches Aliyun RDS 8.0.36's major
        # version; explicit_defaults_for_timestamp=OFF + the strict sql-mode mirror the
        # real RDS parameter template (a bare TIMESTAMP regression would otherwise slip
        # through, see deployment-aliyun-2026-09-02-noconsole.md).
        run: |
          docker run -d --name finflow-mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=ci-root-password \
            -e MYSQL_DATABASE=finflow_ci \
            mysql:8.0 \
            --explicit_defaults_for_timestamp=OFF \
            --sql-mode="ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 60); do
            if docker exec finflow-mysql mysqladmin ping -h127.0.0.1 -uroot -pci-root-password --silent 2>/dev/null; then
              echo "MySQL ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          docker logs finflow-mysql 2>&1 | tail -30 || true
          exit 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package backend
        run: mvn --batch-mode --no-transfer-progress -P '!citic-sdk' clean package -DskipTests

      - name: Migrate MySQL empty, incremental and repeat startup
        shell: bash
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/finflow_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ci-root-password
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
          CITIC_MOCK_MODE: "true"
          KINGDEE_MOCK_MODE: "true"
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          test -n "$jar_file"
          first_log="${RUNNER_TEMP}/finflow-mysql-v1-v5.log"
          incremental_log="${RUNNER_TEMP}/finflow-mysql-v6-v9.log"
          repeat_log="${RUNNER_TEMP}/finflow-mysql-repeat.log"

          wait_for_health() {
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:18080/v3/api-docs > /dev/null; then
                return 0
              fi
              sleep 2
            done
            cat "$1"
            return 1
          }

          java -jar "$jar_file" \
            --server.port=18080 \
            --spring.profiles.active=prod \
            --spring.flyway.target=5 \
            > "$first_log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          wait_for_health "$first_log"
          grep -q 'Successfully applied 5 migrations' "$first_log"
          kill "$app_pid"
          wait "$app_pid" || true
          app_pid=""

          java -jar "$jar_file" \
            --server.port=18080 \
            --spring.profiles.active=prod \
            > "$incremental_log" 2>&1 &
          app_pid=$!
          wait_for_health "$incremental_log"
          grep -q 'Migrating schema.*version "6' "$incremental_log"
          grep -q 'Migrating schema.*version "7' "$incremental_log"
          grep -q 'Migrating schema.*version "8' "$incremental_log"
          grep -q 'Migrating schema.*version "9' "$incremental_log"
          grep -q 'Migrating schema.*version "10' "$incremental_log"
          grep -q 'Migrating schema.*version "11' "$incremental_log"
          grep -q 'Migrating schema.*version "12' "$incremental_log"
          grep -q 'Migrating schema.*version "13' "$incremental_log"
          grep -q 'Migrating schema.*version "14' "$incremental_log"
          grep -q 'Migrating schema.*version "15' "$incremental_log"
          grep -q 'Migrating schema.*version "16' "$incremental_log"
          grep -q 'Migrating schema.*version "17' "$incremental_log"
          grep -q 'Migrating schema.*version "18' "$incremental_log"
          grep -q 'Migrating schema.*version "19' "$incremental_log"
          grep -q 'Migrating schema.*version "20' "$incremental_log"
          grep -q 'Migrating schema.*version "21' "$incremental_log"
          grep -q 'Migrating schema.*version "22' "$incremental_log"
          grep -q 'Migrating schema.*version "23' "$incremental_log"
          grep -q 'Migrating schema.*version "24' "$incremental_log"
          grep -q 'Migrating schema.*version "25' "$incremental_log"
          grep -q 'Migrating schema.*version "26' "$incremental_log"
          grep -q 'Migrating schema.*version "27' "$incremental_log"
          grep -q 'Migrating schema.*version "28' "$incremental_log"
          grep -q 'Migrating schema.*version "29' "$incremental_log"
          grep -q 'Migrating schema.*version "30' "$incremental_log"
          grep -q 'Migrating schema.*version "31' "$incremental_log"
          grep -q 'Migrating schema.*version "32' "$incremental_log"
          grep -q 'Migrating schema.*version "33' "$incremental_log"
          grep -q 'Migrating schema.*version "34' "$incremental_log"
          grep -q 'Migrating schema.*version "35' "$incremental_log"
          grep -q 'Migrating schema.*version "37' "$incremental_log"
          grep -q 'Migrating schema.*version "38' "$incremental_log"
          grep -q 'Migrating schema.*version "39' "$incremental_log"
          grep -q 'Migrating schema.*version "40' "$incremental_log"
          grep -q 'Migrating schema.*version "41' "$incremental_log"
          grep -q 'Migrating schema.*version "42' "$incremental_log"
          grep -q 'Migrating schema.*version "43' "$incremental_log"
          grep -q 'Migrating schema.*version "44' "$incremental_log"
          grep -q 'Migrating schema.*version "45' "$incremental_log"
          grep -q 'Successfully applied 39 migrations' "$incremental_log"
          kill "$app_pid"
          wait "$app_pid" || true
          app_pid=""

          java -jar "$jar_file" \
            --server.port=18080 \
            --spring.profiles.active=prod \
            > "$repeat_log" 2>&1 &
          app_pid=$!
          wait_for_health "$repeat_log"
          grep -q 'Successfully validated 44 migrations' "$repeat_log"
          ! grep -q 'Migrating schema' "$repeat_log"
          kill "$app_pid"
          wait "$app_pid" || true

  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # ── CI 覆盖边界（2026-09-20 结构审阅登记，务必知晓）──────────────────────
      # 本 job 显式 `-P '!citic-sdk'`，且 runner 的 ~/.m2 里没有 vendor jar，而
      # citic-sdk / kingdee-sdk 两个 profile 是按「jar 文件存在」激活的
      # （pom.xml:168-173）。因此：
      #   · `src/citic-sdk/java`、`src/kingdee-sdk/java`（8 文件 / 1334 行）
      #     在 CI 中【不参与编译】，其测试类也不执行；
      #   · CI 验证的是占位实现路径（UnavailableCiticDlinkSdk 的 501 边界）。
      # ⇒ 「CI 绿 ≠ 全路径可编译」。要覆盖真实 SDK 路径，须本地跑裸 `mvn.cmd test`
      #   （全局 ~/.m2 有 vendor jar），或按需为 CI 注入 vendor jar。
      # 覆盖率只上报、不设阈值（无 COVEREDRATIO 校验）：目的是让退化可见，而非拦提交。
      # ────────────────────────────────────────────────────────────────────────
      - name: Build and test (coverage reported, no threshold)
        run: mvn --batch-mode --no-transfer-progress -P '!citic-sdk' verify

      - name: Print instruction coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then echo "未生成 $CSV（JaCoCo 未执行）"; exit 0; fi
          awk -F, 'NR>1 {m+=$4; c+=$5} END {
            if (m+c == 0) { print "覆盖率数据为空"; exit }
            printf "\n总体指令覆盖率: %.1f%%  (covered %d / total %d)\n", 100*c/(m+c), c, m+c
          }' "$CSV"
          echo "--- 覆盖率最低 10 个包（关注退化）---"
          awk -F, 'NR>1 {im[$2]+=$4; ic[$2]+=$5} END {
            for (p in im) if (im[p]+ic[p] > 0) printf "%.1f%%  %s\n", 100*ic[p]/(im[p]+ic[p]), p
          }' "$CSV" | sort -n | head -10

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (Node 20 / pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: finflow-web-dist
          path: frontend/dist
          retention-days: 7
