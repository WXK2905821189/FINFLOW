name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify migration and integration boundaries
        shell: bash
        run: |
          set -euo pipefail
          migration_dir=backend/src/main/resources/db/migration
          test -f "$migration_dir/V1__init_rbac_and_bank_accounts.sql"
          test -f "$migration_dir/V2__statement_import_and_voucher_push.sql"
          compgen -G "$migration_dir/V3__*.sql" > /dev/null
          test -f "$migration_dir/V4__bank_data_access_foundation.sql"
          grep -q 'CREATE TABLE bank_data_raw_message' "$migration_dir/V4__bank_data_access_foundation.sql"
          grep -q 'retention_until TIMESTAMP NOT NULL' "$migration_dir/V4__bank_data_access_foundation.sql"
          grep -q 'raw.setRetentionUntil(receivedAt.plusDays(30))' backend/src/main/java/com/finance/system/bankdata/BankDataSyncExecutor.java
          grep -q '@Scheduled' backend/src/main/java/com/finance/system/bankdata/BankDataSyncScheduler.java
          grep -q '@PostMapping("/sync-tasks")' backend/src/main/java/com/finance/system/bankdata/BankDataController.java
          grep -q 'class MockBankDataAdapter' backend/src/main/java/com/finance/system/bankdata/adapter/MockBankDataAdapter.java
          grep -q 'String requestId' backend/src/main/java/com/finance/system/bankdata/BankDataController.java
          if ! find backend/src/main/java/com/finance/system/bankdata -name '*.java' -print0 | xargs -0 grep -l '@Scheduled' | xargs -r grep -l -E 'retentionUntil|BankDataRawMessage' | grep -q .; then
            echo "A scheduled bank raw-message retention task with retention audit is required for v0.2."
            exit 1
          fi
          if ! grep -q '@RequestParam.*requestId' backend/src/main/java/com/finance/system/bankdata/BankDataController.java; then
            echo "An authorized request-id lookup endpoint is required for v0.2 operations."
            exit 1
          fi
          if git grep -n -I -E '(HttpClient|RestTemplate|WebClient|java\.net\.http|https?://)' -- backend/src/main/java/com/finance/system/bankdata; then
            echo "v0.2 must not call a real bank SDK or API before a separately approved adapter release."
            exit 1
          fi
          if git grep -n -I -E '(BANK|KINGDEE)_(API_)?(KEY|SECRET|TOKEN)=[^${[:space:]]+' -- . ':!docs/deployment-guide.md'; then
            echo "Production bank or Kingdee credentials must not be committed."
            exit 1
          fi

  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Node 20 / pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
